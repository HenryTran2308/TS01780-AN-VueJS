<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Bài 3</title>
</head>

<body>

    <h2 style="text-align: center;">Bài 3</h2>

    <div class="container">
        <ul class="nav nav-tabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#dangky">Đăng Ký</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#dangnhap">Đăng Nhập</a>
            </li>
        </ul>

        <div class="tab-content">

            <div id="dangky" class="container tab-pane active"><br>

                <form class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="hoTen" class="form-label">Họ và Tên</label>
                        <input type="text" class="form-control" id="hoTen" placeholder="Nhập họ và tên" required>
                        <div class="invalid-feedback">Vui lòng điền vào trường này</div>
                    </div>

                    <div class="mb-3">
                        <label for="email1" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email1" placeholder="Nhập email" required>
                        <div class="invalid-feedback">Vui lòng điền vào trường này</div>
                    </div>

                    <div class="mb-3">
                        <label for="sdt" class="form-label">Số Điện Thoại</label>
                        <input type="tel" class="form-control" id="sdt" placeholder="Nhập số điện thoại" required>
                        <div class="invalid-feedback">Vui lòng điền vào trường này</div>
                    </div>

                    <div class="mb-3">
                        <label for="matKhau1" class="form-label">Mật Khẩu</label>
                        <input type="password" class="form-control" id="matKhau1" placeholder="Nhập mật khẩu" required>
                        <div class="invalid-feedback">Vui lòng điền vào trường này</div>
                    </div>

                    <div class="mb-3">
                        <label for="xacNhanMK" class="form-label">Xác Nhận Mật Khẩu</label>
                        <input type="password" class="form-control" id="xacNhanMK" placeholder="Xác nhận mật khẩu"
                            required>
                        <div class="invalid-feedback">Vui lòng điền vào trường này</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giới Tính</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gioiTinh" id="nam" value="nam" checked>
                            <label class="form-check-label" for="nam">Nam</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gioiTinh" id="nu" value="nu">
                            <label class="form-check-label" for="nu">Nữ</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="ngonNgu" class="form-label">Ngôn Ngữ</label>
                        <select class="form-select" id="ngonNgu" required>
                            <option value="">Chọn ngôn ngữ</option>
                            <option value="vn">Tiếng Việt</option>
                            <option value="en">Tiếng Anh</option>
                            <option value="fr">Tiếng Pháp</option>
                        </select>
                        <div class="invalid-feedback">Vui lòng chọn ngôn ngữ</div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="dongY" required>
                            <label class="form-check-label" for="dongY">
                                Tôi đồng ý với các điều khoản và điều kiện
                            </label>
                            <div class="invalid-feedback">Vui lòng đồng ý để tiếp tục</div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Đăng Ký</button>
                </form>
            </div>


            <div id="dangnhap" class="container tab-pane fade"><br>
                <form class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="email2" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email2" placeholder="Nhập email" required>
                        <div class="invalid-feedback">Vui lòng điền vào trường này</div>
                    </div>

                    <div class="mb-3">
                        <label for="matKhau2" class="form-label">Mật Khẩu</label>
                        <input type="password" class="form-control" id="matKhau2" placeholder="Nhập mật khẩu" required>
                        <div class="invalid-feedback">Vui lòng điền vào trường này</div>
                    </div>

                    <button type="submit" class="btn btn-primary">Đăng Nhập</button>
                </form>
            </div>
        </div>
    </div>


    <script>
        (function () {
            'use strict';
            window.addEventListener('load', function () {
                var forms = document.querySelectorAll('.needs-validation');
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
    </script>

</body>

</html>
