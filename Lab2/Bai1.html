<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Bài 1</title>
</head>
<body>

      <div class="container ">
        <h2 class="text-center" style="color: red;">Bảng Thành Phần Dinh Dưỡng</h2>
        
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th rowspan="2" class="bg-warning" style="vertical-align: middle; text-align: center;">Thành Phần</th>
                    <th colspan="2" class="bg-warning" style="vertical-align: middle; text-align: center;">Giá Trị</th>
                </tr>
                <tr>
                    <th class="bg-warning">Khối Lượng</th>
                    <th class="bg-warning">% DV*</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-name">Calories</td>
                    <td class="col-value">200 kcal</td>
                    <td class="col-percent">20%</td>
                </tr>
                <tr>
                    <td class="col-name">Chất Béo</td>
                    <td class="col-value">9 g</td>
                    <td class="col-percent">14%</td>
                </tr>
                <tr>
                    <td class="col-name">Chất Béo Bão Hòa</td>
                    <td class="col-value">4 g</td>
                    <td class="col-percent">20%</td>
                </tr>
                <tr>
                    <td class="col-name">Chất Đạm</td>
                    <td class="col-value">8 g</td>
                    <td class="col-percent">16%</td>
                </tr>
                <tr>
                    <td class="col-name">Chất Xơ</td>
                    <td class="col-value">5 g</td>
                    <td class="col-percent">20%</td>
                </tr>
                <tr>
                    <td class="col-name">Đường</td>
                    <td class="col-value">12 g</td>
                    <td class="col-percent">-</td>
                </tr>
                <tr>
                    <td rowspan="2" class="col-name" style="vertical-align: middle;">Vitamin</td>
                    <td class="col-value">Vitamin C</td>
                    <td class="col-percent">25%</td>
                </tr>
                <tr>
                    <td class="col-value">Vitamin D</td>
                    <td class="col-percent">10%</td>
                </tr>
            </tbody>
        </table>
    </div>

    
</body>
</html>l
