<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>

    <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#dangnhap">Đăng nhập</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#dangky">Đăng ký</a>
        </li>
    </ul>

     <h1>02-Trần Hải An</h1>

    <div class="tab-content">
        <div id="dangnhap" class="container tab-pane active"><br>
           <form class="was-validated">
        <div class="mb-3 mt-3">
            <label for="uname" class="form-label">Họ và tên:</label>
            <input type="text" class="form-control" id="uname" placeholder="Nhập họ tên" required>
            <div class="valid-feedback">Hợp lệ</div>
            <div class="invalid-feedback">Vui lòng điền vào trường này</div>
        </div>
        <div class="mb-3">
            <label for="pwd" class="form-label">Mật khẩu:</label>
            <input type="password" class="form-control" id="pwd" placeholder="Nhập mật khẩu" required>
            <div class="valid-feedback">Hợp lệ</div>
            <div class="invalid-feedback">Vui lòng điền vào trường này</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
            <div class="valid-feedback">Hợp lệ</div>
            <div class="invalid-feedback">Vui lòng điền vào trường này</div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="myCheck" required>
            <label class="form-check-label" for="myCheck">Đồng ý với các điều khoản</label>
            <div class="valid-feedback">Hợp lệ</div>
            <div class="invalid-feedback">Tick vào hộp thoại để xác nhận</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
        </div>
        <div id="dangky" class="container tab-pane fade"><br>
            <p>Form Đăng Ký</p>
        </div>
    </div>



    
</body>

</html>
